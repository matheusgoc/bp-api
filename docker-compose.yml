services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: bp-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - bp-api
    working_dir: /home/dynamodblocal

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: bp-dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: local
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb
    networks:
      - bp-api

  minio:
    image: minio/minio:latest
    container_name: bp-minio
    command: 'server /data --console-address ":9001"'
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: local
      MINIO_ROOT_PASSWORD: local12345
    volumes:
      - minio-data:/data
    networks:
      - bp-api

volumes:
  dynamodb-data:
  minio-data:

networks:
  bp-api:
    # Fixed name so `sam local start-api --docker-network bp-api` can join it
    name: bp-api
