info:
  name: list next page
  type: http
  seq: 7

http:
  method: GET
  url: "{{BASE}}/places/:placeId/offers?take=20&cursor=<meta.nextCursor>"
  params:
    - name: take
      value: "20"
      type: query
      description: page size — default 20, max 100
    - name: cursor
      value: <meta.nextCursor>
      type: query
      description: meta.nextCursor from the previous page
    - name: placeId
      value: 295f833e-9d79-4e68-803f-a22aad2f511e
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
